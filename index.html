<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Studio & Scanner - DESHATOR</title>
  <!-- Library QR Code Stabil & Scanner -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
    .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #334155; color: #94a3b8; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: #0284c7; color: #fff; }

    .content-section { display: none; }
    .content-section.active { display: block; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #38bdf8; margin-bottom: 6px; font-weight: bold; }
    input[type="text"], textarea, input[type="file"], select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.9rem; }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #38bdf8; }

    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.danger { background: #dc2626; flex: 0.4; }
    button.danger:hover { background: #b91c1c; }

    /* Box Wadah QR Code */
    #qrcode-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      padding: 15px;
      background: #ffffff;
      border-radius: 12px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    /* Container Tempat Render Canvas QR */
    .qr-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
    }

    #qrcode canvas, #qrcode img {
      width: 200px !important;
      height: 200px !important;
      display: block;
    }

    /* Efek Garis-Garis (Lines Style) via CSS Pattern Overlay */
    .qr-container.style-lines::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        #ffffff 3px,
        #ffffff 5px
      );
      pointer-events: none;
    }

    /* Efek Titik-Titik (Dots Style) via CSS Pattern Overlay */
    .qr-container.style-dots::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, transparent 40%, #ffffff 45%);
      background-size: 6px 6px;
      pointer-events: none;
    }

    /* Area Responsive Scanner Kamera */
    .reader-wrapper { width: 100%; border-radius: 12px; overflow: hidden; background: #0f172a; border: 1px solid #334155; display: flex; justify-content: center; align-items: center; }
    #reader { width: 100%; max-height: 70vh; overflow: hidden; }
    #reader img, #reader video { max-width: 100% !important; height: auto !important; object-fit: contain !important; margin: 0 auto; display: block; }
    
    .result-box { margin-top: 15px; padding: 15px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; word-break: break-all; }
    .result-title { font-size: 0.8rem; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }
    
    .wifi-details { background: #1e293b; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #0284c7; }
    .wifi-details p { margin-bottom: 5px; font-size: 0.9rem; }

    .footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid #334155; text-align: center; }
    .footer p { font-size: 0.8rem; color: #94a3b8; margin-bottom: 3px; }
    .footer .owner-title { font-weight: bold; color: #38bdf8; font-size: 0.9rem; }
    .footer .owner-ig { color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>QR Code Studio</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('generate')">Buat QR</button>
    <button class="tab-btn" onclick="switchTab('scan')">Scan QR</button>
  </div>

  <!-- SEKSI GENERATE QR -->
  <div id="section-generate" class="content-section active">
    
    <!-- PILIHAN GAYA QR -->
    <div class="form-group">
      <label>Pilih Gaya / Model QR Code:</label>
      <select id="qrStyleSelect">
        <option value="square">QR Umum (Kotak Standard)</option>
        <option value="lines">QR Garis-Garis (Line Style)</option>
        <option value="dots">QR Titik-Titik (Dots Style)</option>
      </select>
    </div>

    <hr style="border-color: #334155; margin: 15px 0;">

    <div class="form-group">
      <label>1. Buat dari Teks / Link:</label>
      <textarea id="textInput" placeholder="Masukkan pesan, nomor HP, atau link web..."></textarea>
      <div class="btn-group">
        <button onclick="generateTextQR()">Buat QR Teks</button>
        <button class="danger" onclick="clearText()">Hapus</button>
      </div>
    </div>

    <hr style="border-color: #334155; margin: 20px 0;">

    <div class="form-group">
      <label>2. Buat dari Foto Galeri:</label>
      <input type="file" id="imageInput" accept="image/*">
      <div class="btn-group">
        <button onclick="generateImageQR()" class="secondary">Buat QR Foto</button>
        <button class="danger" onclick="clearImage()">Hapus</button>
      </div>
    </div>

    <!-- TAMPILAN HASIL GENERATE QR -->
    <div id="qrcode-wrapper" style="display:none;">
      <div id="qrContainer" class="qr-container">
        <div id="qrcode"></div>
      </div>
      <button onclick="downloadQR()" style="margin-top: 15px; background: #16a34a; width:100%;">Download Gambar QR</button>
    </div>
  </div>

  <!-- SEKSI SCANNER QR -->
  <div id="section-scan" class="content-section">
    <div class="reader-wrapper">
      <div id="reader"></div>
    </div>
    <button id="stopBtn" onclick="stopScanner()" style="display:none; background: #dc2626; margin-top: 10px; width:100%;">Matikan Kamera</button>
    <button id="startBtn" onclick="startScanner()" style="margin-top: 10px; width:100%;">Buka Kamera Scanner</button>

    <hr style="border-color: #334155; margin: 20px 0;">

    <div class="form-group">
      <label>Atau Scan dari Gambar Galeri:</label>
      <input type="file" id="qrFileInput" accept="image/*" onchange="scanQRFromImage()">
    </div>

    <div id="scanResult" class="result-box" style="display:none;">
      <div class="result-title">Hasil Pembacaan:</div>
      <div id="resultText"></div>
      <div id="wifiDetails" class="wifi-details" style="display:none;"></div>
      <button class="danger" onclick="clearScanResult()" style="margin-top: 12px; width:100%; padding: 8px;">Hapus Hasil Scan</button>
    </div>
  </div>

  <!-- FOOTER KEPEMILIKAN WEBSITE -->
  <div class="footer">
    <p>Dikembangkan & Dimiliki oleh:</p>
    <p class="owner-title">DESHATOR</p>
    <p>IG: <span class="owner-ig">RMN.TMS.TYNP3</span></p>
  </div>
</div>

<script>
  let html5QrcodeScanner = null;
  let currentQRCode = null;

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

    if(tab === 'generate') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('section-generate').classList.add('active');
      stopScanner();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('section-scan').classList.add('active');
    }
  }

  // Buat QR dari Teks
  function generateTextQR() {
    const text = document.getElementById('textInput').value.trim();
    if(!text) return alert("Masukkan teks atau link terlebih dahulu!");
    renderQR(text);
  }

  // Hapus Input Teks
  function clearText() {
    document.getElementById('textInput').value = "";
    hideQR();
  }

  // Buat QR dari File Foto (Dengan kompresi agar teks tidak terlalu panjang)
  function generateImageQR() {
    const fileInput = document.getElementById('imageInput');
    if(!fileInput.files || fileInput.files.length === 0) return alert("Pilih foto dari galeri terlebih dahulu!");

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Ukuran kecil agar karakter string Base64 muat dalam batas maksimum QR Code
        const maxDim = 50; 
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          }
        } else {
          if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.2);
        renderQR(compressedBase64);
      }
    };
    reader.readAsDataURL(file);
  }

  // Hapus Input Foto
  function clearImage() {
    document.getElementById('imageInput').value = "";
    hideQR();
  }

  // Sembunyikan Tampilan QR
  function hideQR() {
    document.getElementById('qrcode-wrapper').style.display = "none";
    document.getElementById('qrcode').innerHTML = "";
  }

  // Render QR Utama
  function renderQR(data) {
    const wrapper = document.getElementById('qrcode-wrapper');
    const container = document.getElementById('qrcode');
    const qrContainer = document.getElementById('qrContainer');
    const selectedStyle = document.getElementById('qrStyleSelect').value;

    container.innerHTML = "";
    wrapper.style.display = "flex";

    // Pasang Class Gaya (Lines / Dots / Square)
    qrContainer.className = "qr-container style-" + selectedStyle;

    // Render QR Code standar yang pasti berhasil
    currentQRCode = new QRCode(container, {
      text: data,
      width: 200,
      height: 200,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.L
    });
  }

  // Download Gambar QR Langsung ke Simpanan HP
  function downloadQR() {
    const qrContainer = document.getElementById('qrContainer');
    const selectedStyle = document.getElementById('qrStyleSelect').value;
    
    // Ambil elemen Canvas/Img asli dari QRCode.js
    const originalCanvas = document.querySelector('#qrcode canvas');
    const originalImg = document.querySelector('#qrcode img');

    if (!originalCanvas && !originalImg) {
      return alert("Gagal mengunduh, buat QR code terlebih dahulu!");
    }

    // Buat Canvas Gabungan untuk Hasil Download Termasuk Efek Garis
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = 200;
    exportCanvas.height = 200;
    const ctx = exportCanvas.getContext('2d');

    // Gambar QR Asli ke Canvas Gabungan
    if (originalCanvas) {
      ctx.drawImage(originalCanvas, 0, 0, 200, 200);
    } else if (originalImg) {
      ctx.drawImage(originalImg, 0, 0, 200, 200);
    }

    // Jika memilih Gaya Garis (Lines), timpa garis horizontal warna putih ke gambar download
    if (selectedStyle === 'lines') {
      ctx.fillStyle = "#ffffff";
      for (let y = 0; y < 200; y += 5) {
        ctx.fillRect(0, y, 200, 2);
      }
    } else if (selectedStyle === 'dots') {
      // Jika memilih Gaya Dots
      ctx.fillStyle = "#ffffff";
      for (let x = 0; x < 200; x += 6) {
        for (let y = 0; y < 200; y += 6) {
          ctx.beginPath();
          ctx.arc(x, y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Konversi ke Data URL PNG & Unduh
    const imageURI = exportCanvas.toDataURL("image/png");
    const link = document.createElement('a');
    link.href = imageURI;
    link.download = 'QR_Code_DESHATOR.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // Mulai Kamera Scanner
  function startScanner() {
    document.getElementById('startBtn').style.display = "none";
    document.getElementById('stopBtn').style.display = "block";

    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanSuccess,
      onScanFailure
    );
  }

  // Matikan Scanner Kamera
  function stopScanner() {
    if(html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        document.getElementById('startBtn').style.display = "block";
        document.getElementById('stopBtn').style.display = "none";
      }).catch(err => console.error(err));
    }
  }

  // Scan Gambar QR dari Galeri
  function scanQRFromImage() {
    const fileInput = document.getElementById('qrFileInput');
    if(!fileInput.files || fileInput.files.length === 0) return;

    const file = fileInput.files[0];
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.scanFile(file, true)
      .then(decodedText => {
        onScanSuccess(decodedText);
      })
      .catch(err => {
        alert("Gagal membaca QR Code dari gambar ini. Pastikan gambar QR jelas.");
      });
  }

  // Sukses Membaca QR
  function onScanSuccess(decodedText) {
    const resultBox = document.getElementById('scanResult');
    const resultText = document.getElementById('resultText');
    const wifiBox = document.getElementById('wifiDetails');

    resultBox.style.display = "block";
    resultText.innerText = decodedText;

    if(decodedText.startsWith("WIFI:")) {
      wifiBox.style.display = "block";
      
      const ssidMatch = decodedText.match(/S:(.*?);/);
      const passMatch = decodedText.match(/P:(.*?);/);
      const typeMatch = decodedText.match(/T:(.*?);/);

      const ssid = ssidMatch ? ssidMatch[1] : "Tidak diketahui";
      const pass = passMatch ? passMatch[1] : "Tanpa Kata Sandi / Open";
      const type = typeMatch ? typeMatch[1] : "WPA";

      wifiBox.innerHTML = `
        <div style="color:#38bdf8; font-weight:bold; margin-bottom:5px;">📶 Informasi Wi-Fi Terdeteksi:</div>
        <p><b>Nama Wi-Fi (SSID):</b> ${ssid}</p>
        <p><b>Kata Sandi (Password):</b> <span style="background:#0f172a; padding:2px 6px; border-radius:4px; font-family:monospace; color:#22c55e;">${pass}</span></p>
        <p><b>Keamanan:</b> ${type}</p>
      `;
    } else {
      wifiBox.style.display = "none";
    }
  }

  // Hapus Hasil Scan
  function clearScanResult() {
    document.getElementById('scanResult').style.display = "none";
    document.getElementById('resultText').innerText = "";
    document.getElementById('wifiDetails').innerText = "";
    document.getElementById('qrFileInput').value = "";
  }

  function onScanFailure(error) {
    // Membiarkan pemindaian berjalan terus
  }
</script>

</body>
</html>
