<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lacak Foto Sosmed</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    h2 { margin-top: 0; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.95rem; }
    input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #fff; font-size: 0.9rem; }
    input[type="text"]:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Lacak Foto Sosmed</h2>
    <p>Masukkan link/URL foto untuk mencari akun media sosial atau jejak digitalnya.</p>
    
    <input type="text" id="imgUrl" placeholder="https://domain.com/foto.jpg">
    <button onclick="lacakFoto()">Cari dengan Google Lens</button>
  </div>

  <script>
    function lacakFoto() {
      const url = document.getElementById('imgUrl').value.trim();
      
      if (!url) {
        alert("Masukkan URL foto terlebih dahulu!");
        return;
      }

      // Langsung buka Google Lens di tab baru
      const targetUrl = `https://lens.google.com/uploadbyurl?url=${encodeURIComponent(url)}`;
      window.open(targetUrl, '_blank');
    }
  </script>

</body>
</html>
