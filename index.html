<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barcode & QR Code Studio - DESHATOR</title>
  
  <!-- Library QR Code Standard -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Library Barcode 1D (Code 128, Code 39, UPC, ITF) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- Library Barcode 2D (Data Matrix, PDF417) -->
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.0.4/dist/bwip-js-min.js"></script>
  <!-- Library Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
    .container { width: 100%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #38bdf8; font-size: 1.5rem; margin-bottom: 20px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #334155; color: #94a3b8; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { background: #0284c7; color: #fff; }

    .content-section { display: none; }
    .content-section.active { display: block; }

    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #38bdf8; margin-bottom: 6px; font-weight: bold; }
    input[type="text"], textarea, input[type="file"], select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.9rem; }
    textarea { resize: vertical; min-height: 70px; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #38bdf8; }

    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.danger { background: #dc2626; flex: 0.4; }
    button.danger:hover { background: #b91c1c; }

    #barcode-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      padding: 15px;
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
    }

    .output-box {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      overflow-x: auto;
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
    }

    /* Target render canvas & svg */
    .output-box canvas, .output-box svg, .output-box img {
      max-width: 100%;
      height: auto;
      display: block;
      background-color: #ffffff;
    }

    .reader-wrapper { width: 100%; border-radius: 12px; overflow: hidden; background: #0f172a; border: 1px solid #334155; display: flex; justify-content: center; align-items: center; }
    #reader { width: 100%; max-height: 70vh; overflow: hidden; }
    #reader img, #reader video { max-width: 100% !important; height: auto !important; object-fit: contain !important; margin: 0 auto; display: block; }
    
    .result-box { margin-top: 15px; padding: 15px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; word-break: break-all; }
    .result-title { font-size: 0.8rem; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }

    .footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid #334155; text-align: center; }
    .footer p { font-size: 0.8rem; color: #94a3b8; margin-bottom: 3px; }
    .footer .owner-title { font-weight: bold; color: #38bdf8; font-size: 0.9rem; }
    .footer .owner-ig { color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>Barcode & QR Studio</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('generate')">Buat Kode</button>
    <button class="tab-btn" onclick="switchTab('scan')">Scan Kode</button>
  </div>

  <!-- SEKSI GENERATE -->
  <div id="section-generate" class="content-section active">
    
    <!-- PILIHAN JENIS BARCODE / QR CODE -->
    <div class="form-group">
      <label>Pilih Jenis Barcode / QR Code:</label>
      <select id="codeTypeSelect" onchange="autoGenerate()">
        <optgroup label="2D Matrix (Kotak)">
          <option value="qrcode">Quick Response (QR) Code</option>
          <option value="datamatrix">Data Matrix</option>
          <option value="pdf417">PDF417</option>
        </optgroup>
        <optgroup label="1D Barcode (Garis-Garis)">
          <option value="CODE128">Code 128</option>
          <option value="CODE39">Code 39</option>
          <option value="UPC">Universal Product Code (UPC)</option>
          <option value="ITF14">Interleaved 2 of 5 (ITF)</option>
        </optgroup>
      </select>
    </div>

    <hr style="border-color: #334155; margin: 15px 0;">

    <div class="form-group">
      <label>1. Buat dari Teks / Angka / Link:</label>
      <textarea id="textInput" placeholder="Ketik teks atau angka di sini..." oninput="autoGenerate()"></textarea>
      <div class="btn-group">
        <button class="danger" onclick="clearText()">Hapus Teks</button>
      </div>
    </div>

    <hr style="border-color: #334155; margin: 15px 0;">

    <div class="form-group">
      <label>2. Atau Buat dari Foto Galeri:</label>
      <input type="file" id="imageInput" accept="image/*" onchange="generateFromImage()">
      <div class="btn-group">
        <button class="danger" onclick="clearImage()">Hapus Gambar</button>
      </div>
    </div>

    <!-- AREA OUTPUT GAMBAR -->
    <div id="barcode-wrapper" style="display:none;">
      <div class="output-box" id="outputBox"></div>
      <button onclick="downloadCodeWithWhiteBg()" style="margin-top: 15px; background: #16a34a; width:100%;">Download Gambar (Background Putih)</button>
    </div>

  </div>

  <!-- SEKSI SCANNER -->
  <div id="section-scan" class="content-section">
    <div class="reader-wrapper">
      <div id="reader"></div>
    </div>
    <button id="stopBtn" onclick="stopScanner()" style="display:none; background: #dc2626; margin-top: 10px; width:100%;">Matikan Kamera</button>
    <button id="startBtn" onclick="startScanner()" style="margin-top: 10px; width:100%;">Buka Kamera Scanner</button>

    <hr style="border-color: #334155; margin: 20px 0;">

    <div class="form-group">
      <label>Atau Scan Gambar dari Galeri:</label>
      <input type="file" id="qrFileInput" accept="image/*" onchange="scanFromImage()">
    </div>

    <div id="scanResult" class="result-box" style="display:none;">
      <div class="result-title">Hasil Pembacaan:</div>
      <div id="resultText"></div>
      <button class="danger" onclick="clearScanResult()" style="margin-top: 12px; width:100%; padding: 8px;">Hapus Hasil</button>
    </div>
  </div>

  <div class="footer">
    <p>Dikembangkan oleh:</p>
    <p class="owner-title">DESHATOR</p>
    <p>IG: <span class="owner-ig">RMN.TMS.TYNP3</span></p>
  </div>
</div>

<script>
  let html5QrcodeScanner = null;
  let currentActiveData = "";

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

    if(tab === 'generate') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('section-generate').classList.add('active');
      stopScanner();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('section-scan').classList.add('active');
    }
  }

  // Real-time Auto Generate saat mengetik atau mengganti jenis
  function autoGenerate() {
    const text = document.getElementById('textInput').value.trim();
    if (text) {
      currentActiveData = text;
      renderCode(text);
    } else if (!document.getElementById('imageInput').value) {
      hideOutput();
    }
  }

  function generateFromImage() {
    const fileInput = document.getElementById('imageInput');
    if(!fileInput.files || fileInput.files.length === 0) return;

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const maxDim = 40; 
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDim) { height *= maxDim / width; width = maxDim; }
        } else {
          if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        }

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        currentActiveData = canvas.toDataURL('image/jpeg', 0.2);
        renderCode(currentActiveData);
      }
    };
    reader.readAsDataURL(file);
  }

  function renderCode(data) {
    const type = document.getElementById('codeTypeSelect').value;
    const wrapper = document.getElementById('barcode-wrapper');
    const box = document.getElementById('outputBox');

    box.innerHTML = "";
    wrapper.style.display = "flex";

    try {
      if (type === "qrcode") {
        const qrdiv = document.createElement('div');
        box.appendChild(qrdiv);
        new QRCode(qrdiv, {
          text: data,
          width: 180,
          height: 180,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.L
        });
      } 
      else if (type === "datamatrix" || type === "pdf417") {
        const canvas = document.createElement('canvas');
        box.appendChild(canvas);
        bwipjs.toCanvas(canvas, {
          bcid: type,
          text: data,
          scale: 3,
          height: type === 'pdf417' ? 12 : undefined,
          includetext: true,
          textxalign: 'center',
          backgroundcolor: 'ffffff' // Memastikan latar belakang bawaan berwarna putih
        });
      } 
      else {
        // Jenis Barcode 1D (Code 128, Code 39, UPC, ITF)
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        box.appendChild(svg);
        
        let formattedData = data;
        if (type === "UPC") {
          formattedData = data.replace(/\D/g, '');
          if (formattedData.length < 12) formattedData = formattedData.padStart(12, '0').slice(-12);
        } else if (type === "ITF14") {
          formattedData = data.replace(/\D/g, '');
          if (formattedData.length < 14) formattedData = formattedData.padStart(14, '0').slice(-14);
        }

        JsBarcode(svg, formattedData, {
          format: type,
          lineColor: "#000000",
          background: "#ffffff",
          width: 2,
          height: 80,
          displayValue: true
        });
      }
    } catch (err) {
      box.innerHTML = `<p style="color:red; font-size:0.8rem; text-align:center;">Format data tidak cocok untuk jenis barcode ini.<br>Coba gunakan angka atau ubah ke QR Code/Code 128.</p>`;
    }
  }

  // FUNGSI UTAMA DOWNLOAD DENGAN BACKGROUND PUTIH SOLID
  function downloadCodeWithWhiteBg() {
    const box = document.getElementById('outputBox');
    const sourceCanvas = box.querySelector('canvas');
    const sourceImg = box.querySelector('img');
    const sourceSvg = box.querySelector('svg');

    // Jika sumber berupa SVG (Barcode 1D)
    if (sourceSvg) {
      const xml = new XMLSerializer().serializeToString(sourceSvg);
      const svgBase64 = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
      const tempImg = new Image();
      
      tempImg.onload = function() {
        processAndDownloadImage(tempImg, tempImg.width || 300, tempImg.height || 150);
      };
      tempImg.src = svgBase64;
    } 
    // Jika sumber berupa Canvas atau Img (2D / QR)
    else if (sourceCanvas || sourceImg) {
      const tempImg = new Image();
      tempImg.onload = function() {
        processAndDownloadImage(tempImg, tempImg.width, tempImg.height);
      };
      tempImg.src = sourceCanvas ? sourceCanvas.toDataURL("image/png") : sourceImg.src;
    } else {
      alert("Belum ada kode yang dihasilkan untuk diunduh!");
    }
  }

  // Proses pelapisan warna putih pada background canvas sebelum disimpan
  function processAndDownloadImage(imgElement, width, height) {
    const padding = 20; // Memberi margin putih di sekeliling gambar
    const canvas = document.createElement('canvas');
    canvas.width = width + (padding * 2);
    canvas.height = height + (padding * 2);
    const ctx = canvas.getContext('2d');

    // 1. Isikan warna putih ke seluruh permukaan latar belakang
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Gambar kode barcode/QR di atas latar belakang putih
    ctx.drawImage(imgElement, padding, padding, width, height);

    // 3. Konversi ke data PNG & jalankan proses unduh
    const imageURI = canvas.toDataURL("image/png");
    const link = document.createElement('a');
    link.href = imageURI;
    link.download = 'DESHATOR_Code_WhiteBG.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearText() {
    document.getElementById('textInput').value = "";
    hideOutput();
  }

  function clearImage() {
    document.getElementById('imageInput').value = "";
    hideOutput();
  }

  function hideOutput() {
    document.getElementById('barcode-wrapper').style.display = "none";
    document.getElementById('outputBox').innerHTML = "";
    currentActiveData = "";
  }

  // Scanner Kamera & Galeri
  function startScanner() {
    document.getElementById('startBtn').style.display = "none";
    document.getElementById('stopBtn').style.display = "block";

    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanSuccess,
      () => {}
    );
  }

  function stopScanner() {
    if(html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        document.getElementById('startBtn').style.display = "block";
        document.getElementById('stopBtn').style.display = "none";
      }).catch(err => console.error(err));
    }
  }

  function scanFromImage() {
    const fileInput = document.getElementById('qrFileInput');
    if(!fileInput.files || fileInput.files.length === 0) return;

    const file = fileInput.files[0];
    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.scanFile(file, true)
      .then(decodedText => onScanSuccess(decodedText))
      .catch(() => alert("Gagal membaca kode dari gambar ini. Pastikan gambar jelas."));
  }

  function onScanSuccess(decodedText) {
    document.getElementById('scanResult').style.display = "block";
    document.getElementById('resultText').innerText = decodedText;
  }

  function clearScanResult() {
    document.getElementById('scanResult').style.display = "none";
    document.getElementById('resultText').innerText = "";
    document.getElementById('qrFileInput').value = "";
  }
</script>

</body>
</html>
